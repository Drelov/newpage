<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">首页</a>
      <a href="all-posts.html">所有文章</a>
      <a href="write.html">写文章</a>
      <a href="new2.html">网址收藏</a>
    </nav>
  </header>

  <main>
    <article class="post">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        发布于 {{ page.date | date: "%Y-%m-%d %H:%M:%S" }}
      </p>

      <!-- 添加跳转按钮 -->
      <div class="post-content">
        {{ content }}
        <!-- 动态生成跳转按钮 -->
        <button class="edit-btn" id="edit-btn">
          <i class="fas fa-edit"></i>
        </button>
      </div>
    </article>
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>

  <!-- JavaScript 动态生成复制按钮和编辑跳转按钮 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('pre').forEach((pre) => {
        const button = document.createElement('button');
        button.classList.add('copy-btn');
        const icon = document.createElement('i');
        icon.classList.add('fas', 'fa-copy');
        button.appendChild(icon);
        pre.insertBefore(button, pre.firstChild);
        button.addEventListener('click', () => {
          const codeEl = pre.querySelector('code');
          const code = codeEl ? codeEl.innerText : pre.innerText;
          const textArea = document.createElement('textarea');
          textArea.value = code;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          button.innerHTML = '<i class="fas fa-check"></i>';
          setTimeout(() => {
            button.innerHTML = '<i class="fas fa-copy"></i>';
          }, 2000);
        });
      });

      const editButton = document.getElementById('edit-btn');
      if (editButton) {
        const pageName = '{{ page.path }}';
        editButton.addEventListener('click', () => {
          window.location.href = 'write.html?path=' + encodeURIComponent(pageName);
        });
      }

      const content = document.querySelector('.post-content');
      if (content && window.renderMathInElement) {
        renderMathInElement(content, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    });
  </script>

</body>
</html>
