<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约网址管理器 - Gist集成版</title>
    <meta name="description" content="本地优先的网址收藏夹，支持文件夹、搜索筛选和 GitHub Gist 同步。">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4ff, #e6ebff);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(74, 111, 165, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(74, 111, 165, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4a6fa5;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            color: #7d8da7;
            margin-bottom: 8px;
            font-weight: 300;
        }

        .search-section,
        .url-section {
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f8fafd, #f0f5ff);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(74, 111, 165, 0.1);
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 50px;
            padding: 5px 15px;
            box-shadow: 0 2px 10px rgba(74, 111, 165, 0.1);
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.2);
            border: 1px solid rgba(74, 111, 165, 0.3);
        }

        .search-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #4a6fa5;
            text-align: center;
            font-weight: 500;
        }

        .search-hint {
            text-align: center;
            color: #7d8da7;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 14px 15px;
            border: none;
            font-size: 1rem;
            color: #4a6fa5;
            background: transparent;
            outline: none;
        }

        .search-input::placeholder {
            color: #a6b7d4;
        }

        .search-icon,
        .engine-switch-btn {
            background-color: transparent;
            border: none;
            cursor: pointer;
            color: #4a6fa5;
        }

        .search-icon {
            padding: 10px;
            font-size: 18px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .search-icon:hover {
            opacity: 1;
        }

        .engine-switch-btn {
            padding: 8px 12px;
            border-radius: 20px;
            transition: background 0.3s;
            min-width: 58px;
        }

        .engine-switch-btn:hover {
            background: rgba(74, 111, 165, 0.1);
        }

        .engine-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .url-section {
            margin-top: 0;
        }

        .url-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
        }

        .section-title {
            font-size: 1.3rem;
            color: #4a6fa5;
            font-weight: 500;
        }

        .result-count {
            color: #7d8da7;
            font-size: 0.85rem;
            font-weight: 400;
            margin-left: 8px;
        }

        .add-url-btn {
            background: transparent;
            color: #57a773;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            padding: 8px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-url-btn:hover {
            background: rgba(87, 167, 115, 0.1);
            transform: scale(1.05);
        }

        .url-buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-height: 240px;
            overflow-y: auto;
            padding: 10px;
            transition: max-height 0.5s ease;
        }

        .url-buttons-container.expanded {
            max-height: min(70vh, 2400px);
        }

        .url-button {
            padding: 14px 10px 22px;
            background: white;
            color: #4a6fa5;
            border: 1px solid #e1e8f0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 92px;
            user-select: none;
        }

        .url-button:hover,
        .url-button:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.15);
            border-color: #c8d4e9;
            outline: none;
        }

        .url-button .url-icon {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #6c8bc7;
        }

        .url-favicon {
            width: 22px;
            height: 22px;
            margin-bottom: 8px;
            border-radius: 4px;
            object-fit: contain;
        }

        .url-name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .url-folder-label {
            position: absolute;
            bottom: 5px;
            left: 6px;
            right: 6px;
            font-size: 0.7rem;
            color: #7d8da7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .url-button:hover .fav-icon,
        .fav-icon.active {
            opacity: 1;
        }

        .fav-icon {
            position: absolute;
            top: 4px;
            right: 4px;
            color: #ffc107;
            opacity: 0.28;
            transition: opacity 0.3s, transform 0.2s;
            font-size: 0.9rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .fav-icon:hover {
            transform: scale(1.15);
            opacity: 1;
        }

        .folders-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(74, 111, 165, 0.1);
        }

        .folder-tab {
            padding: 8px 16px;
            background: rgba(74, 111, 165, 0.1);
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            color: #4a6fa5;
        }

        .folder-tab.active {
            background: #4a6fa5;
            color: white;
        }

        .folder-tab:hover:not(.active) {
            background: rgba(74, 111, 165, 0.2);
        }

        .folder-tab i {
            font-size: 0.9rem;
        }

        .folder-count {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 0 6px;
            font-size: 0.8rem;
            min-width: 20px;
            text-align: center;
        }

        .folder-tab:not(.active) .folder-count {
            background: rgba(74, 111, 165, 0.12);
        }

        .expand-toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(74, 111, 165, 0.1);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: #6c8bc7;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: rgba(108, 139, 199, 0.1);
        }

        .toggle-btn i {
            margin-left: 8px;
            transition: transform 0.3s;
        }

        .storage-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(74, 111, 165, 0.1);
        }

        .storage-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 10px;
            transition: background 0.3s;
            margin-bottom: 15px;
        }

        .storage-header:hover {
            background: rgba(74, 111, 165, 0.05);
        }

        .storage-title {
            color: #4a6fa5;
            font-size: 1.3rem;
            font-weight: 500;
            margin: 0;
        }

        .storage-toggle-icon {
            color: #4a6fa5;
            transition: transform 0.3s;
        }

        .storage-content {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.5s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .storage-content.expanded {
            max-height: 1400px;
            opacity: 1;
        }

        .storage-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .storage-card {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(74, 111, 165, 0.1);
        }

        .storage-card.github-card {
            background: linear-gradient(135deg, #f8fafd, #f0f5ff);
        }

        .storage-card h3 {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4a6fa5;
            font-weight: 500;
        }

        .storage-icon {
            font-size: 1.5rem;
            color: #6c8bc7;
        }

        .storage-card p {
            color: #7d8da7;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .input-group {
            margin: 15px 0;
        }

        .storage-input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #e1e8f0;
            background: #f8fafd;
            color: #4a6fa5;
            margin-bottom: 12px;
            font-size: 0.95rem;
            transition: border 0.3s, box-shadow 0.3s;
        }

        .storage-input:focus {
            outline: none;
            border-color: #c8d4e9;
            box-shadow: 0 0 0 3px rgba(108, 139, 199, 0.1);
        }

        .action-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            margin: 5px;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .github-btn {
            background: linear-gradient(135deg, #4a6fa5, #6c8bc7);
            color: white;
        }

        .local-btn {
            background: linear-gradient(135deg, #57a773, #72c086);
            color: white;
        }

        .save-btn {
            background: linear-gradient(135deg, #6c8bc7, #8aa7e0);
            color: white;
        }

        .danger-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .ghost-btn {
            background: white;
            color: #4a6fa5;
            border: 1px solid #d5deed;
            box-shadow: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            opacity: 0.95;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #4a6fa5;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #e1e8f0;
            background: #f8fafd;
            color: #4a6fa5;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .modal input:focus,
        .modal select:focus {
            outline: none;
            border-color: #c8d4e9;
            box-shadow: 0 0 0 3px rgba(108, 139, 199, 0.1);
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .storage-options {
                flex-direction: column;
            }

            .search-section,
            .url-section {
                padding: 20px;
            }
        }

        .url-buttons-container::-webkit-scrollbar {
            width: 8px;
        }

        .url-buttons-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 4px;
        }

        .url-buttons-container::-webkit-scrollbar-thumb {
            background: #c8d4e9;
            border-radius: 4px;
        }

        .url-buttons-container::-webkit-scrollbar-thumb:hover {
            background: #a6b7d4;
        }

        .status-message {
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: center;
            font-size: 0.95rem;
        }

        .success {
            background: rgba(87, 167, 115, 0.15);
            color: #57a773;
            border: 1px solid rgba(87, 167, 115, 0.3);
        }

        .error {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .info {
            background: rgba(74, 111, 165, 0.15);
            color: #4a6fa5;
            border: 1px solid rgba(74, 111, 165, 0.3);
        }

        .loader {
            border: 4px solid rgba(74, 111, 165, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4a6fa5;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .context-menu {
            position: fixed;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 1100;
            min-width: 180px;
            overflow: hidden;
            border: 1px solid #eaeef5;
        }

        .context-menu button {
            padding: 12px 20px;
            border: none;
            background: none;
            color: #4a6fa5;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .context-menu button:hover,
        .context-menu button:focus-visible {
            background: #f8fafd;
            outline: none;
        }

        .context-menu button i {
            width: 20px;
            text-align: center;
        }

        .storage-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(74, 111, 165, 0.05);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active {
            background-color: #57a773;
        }

        .status-inactive {
            background-color: #e74c3c;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 20px;
            color: #7d8da7;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #c8d4e9;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .manage-folders-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #7d8da7;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .manage-folders-btn:hover {
            background: rgba(74, 111, 165, 0.1);
            color: #4a6fa5;
        }

        .folder-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(16px);
            min-width: 240px;
            max-width: min(90vw, 480px);
            padding: 12px 18px;
            border-radius: 12px;
            background: #2f3f5b;
            color: white;
            box-shadow: 0 10px 30px rgba(47, 63, 91, 0.25);
            opacity: 0;
            pointer-events: none;
            z-index: 2000;
            text-align: center;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: #3e8f5c; }
        .toast.error { background: #c0392b; }
        .toast.info { background: #4a6fa5; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fab fa-github"></i> 简约网址管理器</h1>
            <p class="subtitle">本地优先保存，可选同步到 GitHub Gist</p>
        </header>

        <section class="search-section">
            <h2 class="search-title">快速搜索</h2>
            <p class="search-hint">输入时筛选收藏，回车使用搜索引擎</p>
            <div class="search-container">
                <button class="engine-switch-btn" id="engineSwitchBtn" type="button" title="切换搜索引擎" aria-label="切换搜索引擎">
                    <span id="engineLabel" class="engine-label">Bing</span>
                </button>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索收藏或网页..." autocomplete="off">
                <button class="search-icon" id="searchBtn" type="button" title="网页搜索">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </section>

        <section class="url-section">
            <div class="url-header">
                <h2 class="section-title">我的网址收藏 <span class="result-count" id="resultCount"></span></h2>
                <button class="add-url-btn" id="addUrlBtn" type="button" title="添加新网址" aria-label="添加新网址">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div class="folders-container" id="foldersContainer"></div>

            <div class="url-buttons-container expanded" id="urlButtonsContainer">
                <div class="empty-state">
                    <i class="fas fa-bookmark"></i>
                    <p>还没有收藏。点击右上角加号添加，数据会先保存在本机。</p>
                </div>
            </div>

            <div class="folder-actions">
                <button class="manage-folders-btn" id="addFolderBtn" type="button">
                    <i class="fas fa-folder-plus"></i> 添加文件夹
                </button>
                <button class="manage-folders-btn" id="editFolderBtn" type="button">
                    <i class="fas fa-edit"></i> 编辑文件夹
                </button>
            </div>

            <div class="expand-toggle">
                <button class="toggle-btn" id="toggleExpandBtn" type="button" aria-expanded="true">
                    <span>收起</span>
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
        </section>

        <section class="storage-section">
            <div class="storage-header" id="storageHeader" role="button" tabindex="0" aria-expanded="false">
                <h2 class="storage-title">存储与同步</h2>
                <i class="fas fa-chevron-down storage-toggle-icon" id="storageToggleIcon"></i>
            </div>

            <div class="storage-content" id="storageContent">
                <div class="storage-options">
                    <div class="storage-card github-card">
                        <h3><i class="storage-icon fab fa-github"></i> GitHub Gist 存储</h3>
                        <p>令牌仅保存在当前浏览器。建议使用仅有 gist 权限的 Fine-grained 或 classic token。</p>

                        <div class="input-group">
                            <input type="password" class="storage-input" id="githubToken" placeholder="GitHub 个人访问令牌" autocomplete="off" spellcheck="false">
                            <input type="text" class="storage-input" id="gistId" placeholder="Gist ID（可留空，首次保存时自动创建）" autocomplete="off" spellcheck="false">
                        </div>

                        <div id="githubStatus" class="status-message info">
                            提示：访问令牌需要 <strong>gist</strong> 权限。未配置时仍可本机使用。
                        </div>

                        <div class="storage-status" id="storageStatus">
                            <span class="status-indicator status-inactive"></span>
                            <span>尚未连接到 GitHub</span>
                        </div>

                        <div class="btn-group">
                            <button class="action-btn github-btn" id="saveToGithubBtn" type="button">
                                <i class="fas fa-cloud-upload-alt"></i> 保存到 GitHub
                            </button>
                            <button class="action-btn github-btn" id="loadFromGithubBtn" type="button">
                                <i class="fas fa-cloud-download-alt"></i> 从 GitHub 加载
                            </button>
                            <button class="action-btn ghost-btn" id="clearTokenBtn" type="button">
                                <i class="fas fa-key"></i> 清除令牌
                            </button>
                        </div>
                    </div>

                    <div class="storage-card">
                        <h3><i class="storage-icon fas fa-database"></i> 本地备份</h3>
                        <p>导出 JSON 备份，或从备份文件恢复。导入时按链接合并，不会随便清空现有收藏。</p>
                        <div class="btn-group">
                            <button class="action-btn local-btn" id="exportBtn" type="button">
                                <i class="fas fa-file-export"></i> 导出备份
                            </button>
                            <button class="action-btn local-btn" id="importBtn" type="button">
                                <i class="fas fa-file-import"></i> 导入备份
                            </button>
                        </div>
                        <input type="file" id="importFile" class="sr-only" accept="application/json,.json">
                    </div>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <button class="action-btn save-btn" id="saveStorageMethodBtn" type="button">
                        <i class="fas fa-save"></i> 保存当前设置
                    </button>
                </div>
            </div>
        </section>

        <div class="loader" id="loader" aria-hidden="true"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal" id="addUrlModal" aria-hidden="true">
        <div class="modal-content">
            <h2><i class="fas fa-plus"></i> 添加新网址</h2>
            <input type="text" id="urlName" placeholder="网址名称">
            <input type="url" id="urlLink" placeholder="网址，例如 github.com">
            <select id="urlFolder">
                <option value="">未分类</option>
            </select>
            <div class="modal-buttons">
                <button class="action-btn github-btn" id="addUrlConfirmBtn" type="button">添加</button>
                <button class="action-btn local-btn" id="addUrlCancelBtn" type="button">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editUrlModal" aria-hidden="true">
        <div class="modal-content">
            <h2><i class="fas fa-edit"></i> 编辑网址</h2>
            <input type="text" id="editUrlName" placeholder="网址名称">
            <input type="url" id="editUrlLink" placeholder="网址">
            <select id="editUrlFolder">
                <option value="">未分类</option>
            </select>
            <div class="modal-buttons">
                <button class="action-btn github-btn" id="editUrlConfirmBtn" type="button">保存</button>
                <button class="action-btn local-btn" id="editUrlCancelBtn" type="button">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addFolderModal" aria-hidden="true">
        <div class="modal-content">
            <h2><i class="fas fa-folder-plus"></i> 添加新文件夹</h2>
            <input type="text" id="folderName" placeholder="文件夹名称">
            <div class="modal-buttons">
                <button class="action-btn github-btn" id="addFolderConfirmBtn" type="button">添加</button>
                <button class="action-btn local-btn" id="addFolderCancelBtn" type="button">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editFolderModal" aria-hidden="true">
        <div class="modal-content">
            <h2><i class="fas fa-edit"></i> 编辑文件夹</h2>
            <select id="folderSelect"></select>
            <input type="text" id="editFolderName" placeholder="新文件夹名称">
            <div class="modal-buttons">
                <button class="action-btn github-btn" id="editFolderConfirmBtn" type="button">保存</button>
                <button class="action-btn local-btn" id="editFolderCancelBtn" type="button">取消</button>
                <button class="action-btn danger-btn" id="deleteFolderBtn" type="button">删除</button>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu" role="menu">
        <button id="editContextBtn" type="button"><i class="fas fa-edit"></i>编辑</button>
        <button id="moveContextBtn" type="button"><i class="fas fa-folder"></i>移动到文件夹</button>
        <button id="favContextBtn" type="button"><i class="fas fa-star"></i>切换星标</button>
        <button id="copyContextBtn" type="button"><i class="fas fa-copy"></i>复制链接</button>
        <button id="deleteContextBtn" type="button"><i class="fas fa-trash"></i>删除</button>
        <button id="openNewTabBtn" type="button"><i class="fas fa-external-link-alt"></i>新标签打开</button>
    </div>

    <div id="folderMenu" class="context-menu" role="menu"></div>

    <script>
        (() => {
            const STORAGE_KEYS = {
                token: 'githubToken',
                gistId: 'gistId',
                urls: 'bookmarkUrls',
                folders: 'folders',
                engine: 'searchEngine',
                expanded: 'urlsExpanded',
                folder: 'currentFolder'
            };

            const DEFAULT_FOLDERS = ['常用', '工作', '学习', '娱乐'];

            const state = {
                urls: [],
                folders: [...DEFAULT_FOLDERS],
                selectedUrlId: null,
                currentGistId: localStorage.getItem(STORAGE_KEYS.gistId) || '',
                githubToken: localStorage.getItem(STORAGE_KEYS.token) || '',
                searchEngine: localStorage.getItem(STORAGE_KEYS.engine) || 'bing',
                isExpanded: localStorage.getItem(STORAGE_KEYS.expanded) !== '0',
                storageExpanded: false,
                currentFolder: localStorage.getItem(STORAGE_KEYS.folder) || '全部',
                bookmarkQuery: '',
                suppressNextClick: false
            };

            let cloudSaveTimer = null;
            let toastTimer = null;
            let pressTimer = null;

            const els = {
                urlButtonsContainer: document.getElementById('urlButtonsContainer'),
                foldersContainer: document.getElementById('foldersContainer'),
                githubTokenInput: document.getElementById('githubToken'),
                gistIdInput: document.getElementById('gistId'),
                githubStatus: document.getElementById('githubStatus'),
                loader: document.getElementById('loader'),
                engineLabel: document.getElementById('engineLabel'),
                toggleExpandBtn: document.getElementById('toggleExpandBtn'),
                storageHeader: document.getElementById('storageHeader'),
                storageContent: document.getElementById('storageContent'),
                storageToggleIcon: document.getElementById('storageToggleIcon'),
                storageStatus: document.getElementById('storageStatus'),
                searchInput: document.getElementById('searchInput'),
                toast: document.getElementById('toast'),
                resultCount: document.getElementById('resultCount'),
                contextMenu: document.getElementById('contextMenu'),
                folderMenu: document.getElementById('folderMenu'),
                importFile: document.getElementById('importFile')
            };

            function uid() {
                if (crypto.randomUUID) return crypto.randomUUID();
                return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function normalizeLink(raw) {
                const trimmed = String(raw || '').trim();
                if (!trimmed) return '';
                if (/^https?:\/\//i.test(trimmed)) return trimmed;
                if (/^\/\//.test(trimmed)) return 'https:' + trimmed;
                return 'https://' + trimmed;
            }

            function isSafeHttpUrl(link) {
                try {
                    const parsed = new URL(link);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:';
                } catch (e) {
                    return false;
                }
            }

            function hostnameOf(link) {
                try {
                    return new URL(link).hostname;
                } catch (e) {
                    return '';
                }
            }

            function faviconSrc(link) {
                const host = hostnameOf(link);
                if (!host) return '';
                return 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(host);
            }

            function migrateUrl(raw) {
                const link = normalizeLink(raw && raw.link);
                return {
                    id: (raw && raw.id) || uid(),
                    name: String((raw && raw.name) || hostnameOf(link) || '未命名').trim(),
                    link,
                    folder: (raw && raw.folder) || '',
                    favorite: !!(raw && raw.favorite),
                    createdAt: (raw && raw.createdAt) || Date.now()
                };
            }

            function ensureFoldersFromUrls() {
                state.urls.forEach((url) => {
                    if (url.folder && !state.folders.includes(url.folder)) {
                        state.folders.push(url.folder);
                    }
                });
            }

            function persistLocal() {
                localStorage.setItem(STORAGE_KEYS.urls, JSON.stringify(state.urls));
                localStorage.setItem(STORAGE_KEYS.folders, JSON.stringify(state.folders));
                localStorage.setItem(STORAGE_KEYS.folder, state.currentFolder);
                localStorage.setItem(STORAGE_KEYS.expanded, state.isExpanded ? '1' : '0');
                localStorage.setItem(STORAGE_KEYS.engine, state.searchEngine);
                if (state.currentGistId) {
                    localStorage.setItem(STORAGE_KEYS.gistId, state.currentGistId);
                }
            }

            function loadLocalData() {
                try {
                    const savedUrls = localStorage.getItem(STORAGE_KEYS.urls);
                    if (savedUrls) {
                        const parsed = JSON.parse(savedUrls);
                        if (Array.isArray(parsed)) state.urls = parsed.map(migrateUrl);
                    }
                } catch (e) {
                    state.urls = [];
                }

                try {
                    const savedFolders = localStorage.getItem(STORAGE_KEYS.folders);
                    if (savedFolders) {
                        const parsed = JSON.parse(savedFolders);
                        if (Array.isArray(parsed) && parsed.length) {
                            state.folders = parsed.filter(Boolean);
                        }
                    }
                } catch (e) {
                    state.folders = [...DEFAULT_FOLDERS];
                }

                ensureFoldersFromUrls();
            }

            function selectedUrl() {
                return state.urls.find((url) => url.id === state.selectedUrlId) || null;
            }

            function getVisibleUrls() {
                let list = state.urls;
                if (state.currentFolder === '星标') {
                    list = list.filter((url) => url.favorite);
                } else if (state.currentFolder === '未分类') {
                    list = list.filter((url) => !url.folder);
                } else if (state.currentFolder !== '全部') {
                    list = list.filter((url) => url.folder === state.currentFolder);
                }

                const query = state.bookmarkQuery.trim().toLowerCase();
                if (query) {
                    list = list.filter((url) =>
                        url.name.toLowerCase().includes(query) ||
                        url.link.toLowerCase().includes(query) ||
                        (url.folder && url.folder.toLowerCase().includes(query))
                    );
                }

                return [...list].sort((a, b) => Number(b.favorite) - Number(a.favorite));
            }

            function showToast(message, type) {
                els.toast.textContent = message;
                els.toast.className = 'toast show ' + (type || 'info');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    els.toast.classList.remove('show');
                }, 2800);
            }

            function showStatus(message, type, options) {
                const opts = options || {};
                els.githubStatus.textContent = message;
                els.githubStatus.className = 'status-message ' + type;
                if (!opts.silentToast) showToast(message, type);
                if (type === 'error' && !state.storageExpanded && opts.expandStorage) {
                    setStorageExpanded(true);
                }
            }

            function showLoader() {
                els.loader.style.display = 'block';
                els.loader.setAttribute('aria-hidden', 'false');
            }

            function hideLoader() {
                els.loader.style.display = 'none';
                els.loader.setAttribute('aria-hidden', 'true');
            }

            function updateStorageStatus() {
                const indicator = els.storageStatus.querySelector('.status-indicator');
                const text = els.storageStatus.querySelector('span:last-child');
                if (state.githubToken) {
                    indicator.className = 'status-indicator status-active';
                    text.textContent = state.currentGistId
                        ? '已连接 GitHub（Gist ID: ' + state.currentGistId.slice(0, 8) + '…）'
                        : '已保存令牌，首次云端保存时会创建 Gist';
                } else {
                    indicator.className = 'status-indicator status-inactive';
                    text.textContent = '尚未连接到 GitHub，当前使用本机存储';
                }
            }

            function updateEngineLabel() {
                els.engineLabel.textContent = state.searchEngine === 'google' ? 'Google' : 'Bing';
            }

            function updateExpandButton() {
                const icon = els.toggleExpandBtn.querySelector('i');
                const text = els.toggleExpandBtn.querySelector('span');
                if (state.isExpanded) {
                    els.urlButtonsContainer.classList.add('expanded');
                    text.textContent = '收起';
                    icon.className = 'fas fa-chevron-up';
                    els.toggleExpandBtn.setAttribute('aria-expanded', 'true');
                } else {
                    els.urlButtonsContainer.classList.remove('expanded');
                    text.textContent = '展开全部';
                    icon.className = 'fas fa-chevron-down';
                    els.toggleExpandBtn.setAttribute('aria-expanded', 'false');
                }
            }

            function setStorageExpanded(expanded) {
                state.storageExpanded = expanded;
                els.storageContent.classList.toggle('expanded', expanded);
                els.storageHeader.setAttribute('aria-expanded', String(expanded));
                els.storageToggleIcon.classList.toggle('fa-chevron-up', expanded);
                els.storageToggleIcon.classList.toggle('fa-chevron-down', !expanded);
            }

            function hideMenus() {
                els.contextMenu.style.display = 'none';
                els.folderMenu.style.display = 'none';
            }

            function placeMenu(menu, x, y) {
                menu.style.display = 'block';
                const rect = menu.getBoundingClientRect();
                const left = Math.min(Math.max(8, x), window.innerWidth - rect.width - 8);
                const top = Math.min(Math.max(8, y), window.innerHeight - rect.height - 8);
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
            }

            function openModal(modalId) {
                const modal = document.getElementById(modalId);
                modal.style.display = 'flex';
                modal.setAttribute('aria-hidden', 'false');
                const focusable = modal.querySelector('input, select, button');
                if (focusable) setTimeout(() => focusable.focus(), 30);
            }

            function closeModal(modalId) {
                const modal = document.getElementById(modalId);
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
            }

            function closeAllModals() {
                document.querySelectorAll('.modal').forEach((modal) => {
                    modal.style.display = 'none';
                    modal.setAttribute('aria-hidden', 'true');
                });
            }

            function populateFolderSelect(selectId, selectedFolder, includeUncategorized) {
                const select = document.getElementById(selectId);
                select.innerHTML = includeUncategorized === false ? '' : '<option value="">未分类</option>';
                state.folders.forEach((folder) => {
                    const option = document.createElement('option');
                    option.value = folder;
                    option.textContent = folder;
                    option.selected = folder === selectedFolder;
                    select.appendChild(option);
                });
            }

            function commitChange(options) {
                const opts = options || {};
                persistLocal();
                renderFolders();
                renderUrls();
                if (opts.cloud !== false) scheduleCloudSave(opts.silent);
            }

            function scheduleCloudSave(silent) {
                if (!state.githubToken) return;
                clearTimeout(cloudSaveTimer);
                cloudSaveTimer = setTimeout(() => saveToGitHub({ silent: silent !== false }), 700);
            }

            function renderFolders() {
                els.foldersContainer.innerHTML = '';
                const counts = {
                    '全部': state.urls.length,
                    '星标': state.urls.filter((url) => url.favorite).length,
                    '未分类': state.urls.filter((url) => !url.folder).length
                };

                const tabs = [
                    { name: '全部', icon: 'fa-layer-group' },
                    { name: '星标', icon: 'fa-star' },
                    { name: '未分类', icon: 'fa-inbox' }
                ].concat(state.folders.map((name) => ({ name, icon: 'fa-folder' })));

                if (!tabs.some((tab) => tab.name === state.currentFolder)) {
                    state.currentFolder = '全部';
                }

                tabs.forEach((tab) => {
                    const count = Object.prototype.hasOwnProperty.call(counts, tab.name)
                        ? counts[tab.name]
                        : state.urls.filter((url) => url.folder === tab.name).length;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'folder-tab' + (state.currentFolder === tab.name ? ' active' : '');
                    const iconName = tab.name === '星标'
                        ? 'fa-star'
                        : (state.currentFolder === tab.name && tab.icon === 'fa-folder' ? 'fa-folder-open' : tab.icon);
                    btn.innerHTML =
                        '<i class="fas ' + iconName + '"></i>' +
                        '<span>' + escapeHtml(tab.name) + '</span>' +
                        '<span class="folder-count">' + count + '</span>';
                    btn.addEventListener('click', () => {
                        state.currentFolder = tab.name;
                        persistLocal();
                        renderFolders();
                        renderUrls();
                    });
                    els.foldersContainer.appendChild(btn);
                });
            }

            function openLink(link) {
                if (!isSafeHttpUrl(link)) {
                    showStatus('该链接不安全，已阻止打开', 'error');
                    return;
                }
                window.open(link, '_blank', 'noopener,noreferrer');
            }

            function renderUrls() {
                const visible = getVisibleUrls();
                els.urlButtonsContainer.innerHTML = '';
                els.resultCount.textContent = state.urls.length
                    ? '（' + visible.length + '/' + state.urls.length + '）'
                    : '';

                if (!visible.length) {
                    const queryHint = state.bookmarkQuery
                        ? '没有匹配“' + escapeHtml(state.bookmarkQuery) + '”的收藏'
                        : (state.currentFolder === '全部' ? '还没有收藏，点击右上角加号添加' : '该分组是空的');
                    els.urlButtonsContainer.innerHTML =
                        '<div class="empty-state"><i class="fas fa-inbox"></i><p>' + queryHint + '</p></div>';
                    updateExpandButton();
                    return;
                }

                const fragment = document.createDocumentFragment();
                visible.forEach((url) => {
                    const card = document.createElement('div');
                    card.className = 'url-button';
                    card.tabIndex = 0;
                    card.setAttribute('role', 'link');
                    card.dataset.id = url.id;
                    card.title = url.link;

                    const favicon = document.createElement('img');
                    favicon.className = 'url-favicon';
                    favicon.alt = '';
                    favicon.src = faviconSrc(url.link);
                    favicon.addEventListener('error', () => {
                        const icon = document.createElement('i');
                        icon.className = 'fas fa-link url-icon';
                        if (favicon.parentNode) favicon.replaceWith(icon);
                    });

                    const name = document.createElement('span');
                    name.className = 'url-name';
                    name.textContent = url.name;

                    const favBtn = document.createElement('button');
                    favBtn.type = 'button';
                    favBtn.className = 'fav-icon' + (url.favorite ? ' active' : '');
                    favBtn.title = url.favorite ? '取消星标' : '加为星标';
                    favBtn.setAttribute('aria-label', favBtn.title);
                    favBtn.innerHTML = '<i class="fas fa-star"></i>';
                    favBtn.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        toggleFavorite(url.id);
                    });

                    card.appendChild(favicon);
                    card.appendChild(name);
                    card.appendChild(favBtn);

                    if (url.folder && state.currentFolder === '全部') {
                        const folderLabel = document.createElement('span');
                        folderLabel.className = 'url-folder-label';
                        folderLabel.textContent = url.folder;
                        card.appendChild(folderLabel);
                    }

                    card.addEventListener('click', () => {
                        if (state.suppressNextClick) {
                            state.suppressNextClick = false;
                            return;
                        }
                        openLink(url.link);
                    });
                    card.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openLink(url.link);
                        }
                    });
                    card.addEventListener('contextmenu', (event) => {
                        event.preventDefault();
                        state.selectedUrlId = url.id;
                        hideMenus();
                        placeMenu(els.contextMenu, event.clientX, event.clientY);
                    });
                    card.addEventListener('touchstart', (event) => {
                        const touch = event.touches[0];
                        clearTimeout(pressTimer);
                        pressTimer = setTimeout(() => {
                            state.selectedUrlId = url.id;
                            state.suppressNextClick = true;
                            hideMenus();
                            placeMenu(els.contextMenu, touch.clientX, touch.clientY);
                        }, 520);
                    }, { passive: true });
                    card.addEventListener('touchend', () => clearTimeout(pressTimer));
                    card.addEventListener('touchmove', () => clearTimeout(pressTimer));

                    fragment.appendChild(card);
                });

                els.urlButtonsContainer.appendChild(fragment);
                updateExpandButton();
            }

            function filterBookmarksFromSearch() {
                state.bookmarkQuery = els.searchInput.value;
                if (state.bookmarkQuery.trim() && !state.isExpanded) {
                    state.isExpanded = true;
                    persistLocal();
                }
                renderUrls();
            }

            function searchWeb() {
                const query = els.searchInput.value.trim();
                if (!query) return;
                const searchUrl = state.searchEngine === 'google'
                    ? 'https://www.google.com/search?q=' + encodeURIComponent(query)
                    : 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                window.open(searchUrl, '_blank', 'noopener,noreferrer');
            }

            function toggleSearchEngine() {
                state.searchEngine = state.searchEngine === 'bing' ? 'google' : 'bing';
                persistLocal();
                updateEngineLabel();
                showToast('搜索引擎已切换为 ' + (state.searchEngine === 'google' ? 'Google' : 'Bing'), 'info');
            }

            function findDuplicate(link, exceptId) {
                return state.urls.find((url) => url.link === link && url.id !== exceptId);
            }

            function addUrl() {
                const name = document.getElementById('urlName').value.trim();
                const link = normalizeLink(document.getElementById('urlLink').value);
                const folder = document.getElementById('urlFolder').value;

                if (!name || !link) {
                    showStatus('请填写网址名称和链接', 'error');
                    return;
                }
                if (!isSafeHttpUrl(link)) {
                    showStatus('请输入有效的 http/https 网址', 'error');
                    return;
                }
                if (findDuplicate(link)) {
                    showStatus('该网址已经在收藏里了', 'error');
                    return;
                }

                state.urls.push(migrateUrl({ name, link, folder }));
                if (folder) state.currentFolder = folder;
                document.getElementById('urlName').value = '';
                document.getElementById('urlLink').value = '';
                closeModal('addUrlModal');
                commitChange();
                showToast('已添加并保存到本机', 'success');
            }

            function updateUrl() {
                const current = selectedUrl();
                if (!current) return;
                const name = document.getElementById('editUrlName').value.trim();
                const link = normalizeLink(document.getElementById('editUrlLink').value);
                const folder = document.getElementById('editUrlFolder').value;

                if (!name || !link) {
                    showStatus('请填写网址名称和链接', 'error');
                    return;
                }
                if (!isSafeHttpUrl(link)) {
                    showStatus('请输入有效的 http/https 网址', 'error');
                    return;
                }
                if (findDuplicate(link, current.id)) {
                    showStatus('该网址已经在收藏里了', 'error');
                    return;
                }

                current.name = name;
                current.link = link;
                current.folder = folder;
                closeModal('editUrlModal');
                commitChange();
                showToast('网址已更新', 'success');
            }

            function editSelectedUrl() {
                const current = selectedUrl();
                if (!current) return;
                document.getElementById('editUrlName').value = current.name;
                document.getElementById('editUrlLink').value = current.link;
                populateFolderSelect('editUrlFolder', current.folder || '');
                hideMenus();
                openModal('editUrlModal');
            }

            function deleteSelectedUrl() {
                const current = selectedUrl();
                if (!current) return;
                if (!confirm('确定要删除“' + current.name + '”吗？')) return;
                state.urls = state.urls.filter((url) => url.id !== current.id);
                state.selectedUrlId = null;
                hideMenus();
                commitChange();
                showToast('已删除', 'success');
            }

            function toggleFavorite(id) {
                const current = state.urls.find((url) => url.id === id);
                if (!current) return;
                current.favorite = !current.favorite;
                commitChange();
            }

            function copySelectedLink() {
                const current = selectedUrl();
                if (!current) return;
                const done = () => {
                    hideMenus();
                    showToast('链接已复制', 'success');
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(current.link).then(done).catch(() => {
                        window.prompt('复制链接：', current.link);
                        done();
                    });
                } else {
                    window.prompt('复制链接：', current.link);
                    done();
                }
            }

            function moveUrlToFolder(folder) {
                const current = selectedUrl();
                if (!current) return;
                current.folder = folder;
                hideMenus();
                commitChange();
                showToast(folder ? '已移动到 ' + folder : '已移出文件夹', 'success');
            }

            function showFolderMenu(event) {
                event.preventDefault();
                event.stopPropagation();
                els.folderMenu.innerHTML = '';

                const makeItem = (label, icon, folderValue) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.innerHTML = '<i class="fas ' + icon + '"></i> ' + escapeHtml(label);
                    btn.addEventListener('click', () => moveUrlToFolder(folderValue));
                    els.folderMenu.appendChild(btn);
                };

                makeItem('未分类', 'fa-inbox', '');
                state.folders.forEach((folder) => makeItem(folder, 'fa-folder-open', folder));

                const createBtn = document.createElement('button');
                createBtn.type = 'button';
                createBtn.innerHTML = '<i class="fas fa-plus"></i> 新建文件夹';
                createBtn.addEventListener('click', () => {
                    hideMenus();
                    openModal('addFolderModal');
                });
                els.folderMenu.appendChild(createBtn);

                const rect = els.contextMenu.getBoundingClientRect();
                hideMenus();
                placeMenu(els.folderMenu, rect.right - 8, rect.top);
            }

            function addFolder() {
                const name = document.getElementById('folderName').value.trim();
                if (!name) {
                    showStatus('请输入文件夹名称', 'error');
                    return;
                }
                if (['全部', '星标', '未分类'].includes(name) || state.folders.includes(name)) {
                    showStatus('文件夹名称已存在', 'error');
                    return;
                }
                state.folders.push(name);
                state.currentFolder = name;
                document.getElementById('folderName').value = '';
                closeModal('addFolderModal');
                commitChange();
                showToast('文件夹已创建', 'success');
            }

            function editFolder() {
                const oldName = document.getElementById('folderSelect').value;
                const newName = document.getElementById('editFolderName').value.trim();
                if (!oldName) {
                    showStatus('请选择要编辑的文件夹', 'error');
                    return;
                }
                if (!newName) {
                    showStatus('请输入新文件夹名称', 'error');
                    return;
                }
                if (newName === oldName) {
                    closeModal('editFolderModal');
                    return;
                }
                if (['全部', '星标', '未分类'].includes(newName) || state.folders.includes(newName)) {
                    showStatus('文件夹名称已存在', 'error');
                    return;
                }

                const index = state.folders.indexOf(oldName);
                if (index === -1) return;
                state.folders[index] = newName;
                state.urls.forEach((url) => {
                    if (url.folder === oldName) url.folder = newName;
                });
                if (state.currentFolder === oldName) state.currentFolder = newName;
                closeModal('editFolderModal');
                commitChange();
                showToast('文件夹已重命名', 'success');
            }

            function deleteFolder() {
                const folderName = document.getElementById('folderSelect').value;
                if (!folderName) {
                    showStatus('请选择要删除的文件夹', 'error');
                    return;
                }
                if (!confirm('确定删除文件夹“' + folderName + '”吗？其中的网址会移到未分类。')) return;
                state.folders = state.folders.filter((folder) => folder !== folderName);
                state.urls.forEach((url) => {
                    if (url.folder === folderName) url.folder = '';
                });
                if (state.currentFolder === folderName) state.currentFolder = '全部';
                closeModal('editFolderModal');
                commitChange();
                showToast('文件夹已删除', 'success');
            }

            function authHeaders(token) {
                return {
                    Authorization: 'Bearer ' + token,
                    Accept: 'application/vnd.github+json'
                };
            }

            async function saveToGitHub(options) {
                const opts = options || {};
                persistLocal();
                const token = els.githubTokenInput.value.trim() || state.githubToken;
                const gistId = els.gistIdInput.value.trim() || state.currentGistId;

                if (!token) {
                    if (!opts.silent) showStatus('已保存到本机。配置 GitHub 令牌后即可云端同步', 'info');
                    return;
                }

                if (!opts.silent) showLoader();
                const payload = {
                    description: '网址管理器数据',
                    public: false,
                    files: {
                        'urls.json': { content: JSON.stringify(state.urls, null, 2) },
                        'folders.json': { content: JSON.stringify(state.folders, null, 2) }
                    }
                };

                try {
                    const response = await fetch(
                        gistId ? 'https://api.github.com/gists/' + gistId : 'https://api.github.com/gists',
                        {
                            method: gistId ? 'PATCH' : 'POST',
                            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(token)),
                            body: JSON.stringify(payload)
                        }
                    );
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || '保存失败');
                    if (!data.id) throw new Error('未返回 Gist ID');

                    state.currentGistId = data.id;
                    els.gistIdInput.value = data.id;
                    localStorage.setItem(STORAGE_KEYS.gistId, data.id);
                    if (els.githubTokenInput.value.trim()) {
                        state.githubToken = els.githubTokenInput.value.trim();
                        localStorage.setItem(STORAGE_KEYS.token, state.githubToken);
                        els.githubTokenInput.value = '';
                        els.githubTokenInput.placeholder = '已保存令牌，重新输入可更新';
                    }
                    updateStorageStatus();
                    if (!opts.silent) showStatus('数据已同步到 GitHub Gist', 'success');
                } catch (error) {
                    showStatus('云端保存失败: ' + error.message, 'error', { expandStorage: !opts.silent });
                } finally {
                    hideLoader();
                }
            }

            async function loadFromGitHub(options) {
                const opts = options || {};
                const token = els.githubTokenInput.value.trim() || state.githubToken || localStorage.getItem(STORAGE_KEYS.token);
                const gistId = els.gistIdInput.value.trim() || state.currentGistId || localStorage.getItem(STORAGE_KEYS.gistId);

                if (!token) {
                    showStatus('请输入 GitHub 访问令牌', 'error', { expandStorage: true });
                    return;
                }
                if (!gistId) {
                    showStatus('请输入 Gist ID，或先保存以创建新 Gist', 'error', { expandStorage: true });
                    return;
                }

                showLoader();
                try {
                    const response = await fetch('https://api.github.com/gists/' + gistId, {
                        headers: authHeaders(token)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || '加载失败');

                    const urlsContent = data.files && data.files['urls.json'] && data.files['urls.json'].content;
                    if (!urlsContent) throw new Error('未找到 urls.json');
                    const parsedUrls = JSON.parse(urlsContent);
                    if (!Array.isArray(parsedUrls)) throw new Error('urls.json 格式不正确');
                    state.urls = parsedUrls.map(migrateUrl);

                    const foldersContent = data.files && data.files['folders.json'] && data.files['folders.json'].content;
                    if (foldersContent) {
                        const parsedFolders = JSON.parse(foldersContent);
                        if (Array.isArray(parsedFolders)) {
                            state.folders = parsedFolders.filter(Boolean);
                        }
                    }
                    ensureFoldersFromUrls();

                    if (els.githubTokenInput.value.trim()) {
                        state.githubToken = els.githubTokenInput.value.trim();
                        localStorage.setItem(STORAGE_KEYS.token, state.githubToken);
                        els.githubTokenInput.value = '';
                        els.githubTokenInput.placeholder = '已保存令牌，重新输入可更新';
                    }
                    state.currentGistId = gistId;
                    localStorage.setItem(STORAGE_KEYS.gistId, gistId);
                    els.gistIdInput.value = gistId;
                    persistLocal();
                    renderFolders();
                    renderUrls();
                    updateStorageStatus();
                    showStatus(opts.auto ? '已从 GitHub 恢复收藏' : '数据加载成功', 'success');
                } catch (error) {
                    showStatus('加载失败: ' + error.message, 'error', { expandStorage: !opts.auto });
                } finally {
                    hideLoader();
                }
            }

            function saveStorageMethod() {
                const token = els.githubTokenInput.value.trim();
                if (token) {
                    state.githubToken = token;
                    localStorage.setItem(STORAGE_KEYS.token, token);
                    els.githubTokenInput.value = '';
                    els.githubTokenInput.placeholder = '已保存令牌，重新输入可更新';
                }
                const gistId = els.gistIdInput.value.trim();
                if (gistId) {
                    state.currentGistId = gistId;
                    localStorage.setItem(STORAGE_KEYS.gistId, gistId);
                }
                persistLocal();
                updateStorageStatus();
                showStatus('存储设置已保存', 'success');
            }

            function clearToken() {
                if (!confirm('确定清除本机保存的 GitHub 令牌吗？收藏数据仍会留在本机。')) return;
                state.githubToken = '';
                localStorage.removeItem(STORAGE_KEYS.token);
                els.githubTokenInput.value = '';
                els.githubTokenInput.placeholder = 'GitHub 个人访问令牌';
                updateStorageStatus();
                showStatus('已清除令牌', 'info');
            }

            function exportBackup() {
                const payload = {
                    exportedAt: new Date().toISOString(),
                    urls: state.urls,
                    folders: state.folders
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'bookmarks-backup.json';
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(link.href);
                showToast('已导出备份', 'success');
            }

            function importBackup(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        const incomingUrls = Array.isArray(parsed) ? parsed : parsed.urls;
                        const incomingFolders = Array.isArray(parsed) ? [] : (parsed.folders || []);
                        if (!Array.isArray(incomingUrls)) throw new Error('备份中没有 urls 数组');

                        incomingFolders.forEach((folder) => {
                            if (folder && !state.folders.includes(folder) && !['全部', '星标', '未分类'].includes(folder)) {
                                state.folders.push(folder);
                            }
                        });
                        incomingUrls.map(migrateUrl).forEach((url) => {
                            const existing = state.urls.find((item) => item.id === url.id || item.link === url.link);
                            if (existing) {
                                existing.name = url.name;
                                existing.link = url.link;
                                existing.folder = url.folder;
                                existing.favorite = url.favorite;
                            } else {
                                state.urls.push(url);
                            }
                        });
                        ensureFoldersFromUrls();
                        commitChange();
                        showStatus('备份已导入并合并', 'success');
                    } catch (error) {
                        showStatus('导入失败: ' + error.message, 'error');
                    }
                };
                reader.readAsText(file);
            }

            function bindModalSubmit(modalId, handler) {
                const modal = document.getElementById(modalId);
                modal.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        handler();
                    }
                });
            }

            function setupEventListeners() {
                document.getElementById('searchBtn').addEventListener('click', searchWeb);
                els.searchInput.addEventListener('input', filterBookmarksFromSearch);
                els.searchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') searchWeb();
                });
                document.getElementById('engineSwitchBtn').addEventListener('click', toggleSearchEngine);
                document.getElementById('addUrlBtn').addEventListener('click', () => {
                    populateFolderSelect('urlFolder', state.currentFolder === '全部' || state.currentFolder === '星标' || state.currentFolder === '未分类' ? '' : state.currentFolder);
                    openModal('addUrlModal');
                });
                document.getElementById('saveToGithubBtn').addEventListener('click', () => saveToGitHub({ silent: false }));
                document.getElementById('loadFromGithubBtn').addEventListener('click', () => loadFromGitHub({ auto: false }));
                document.getElementById('saveStorageMethodBtn').addEventListener('click', saveStorageMethod);
                document.getElementById('clearTokenBtn').addEventListener('click', clearToken);
                document.getElementById('exportBtn').addEventListener('click', exportBackup);
                document.getElementById('importBtn').addEventListener('click', () => els.importFile.click());
                els.importFile.addEventListener('change', (event) => {
                    const file = event.target.files && event.target.files[0];
                    if (file) importBackup(file);
                    event.target.value = '';
                });

                document.addEventListener('click', (event) => {
                    if (!event.target.closest('.context-menu')) hideMenus();
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        hideMenus();
                        closeAllModals();
                    }
                    if (event.key === '/' && document.activeElement !== els.searchInput && !event.target.closest('input, select, textarea')) {
                        event.preventDefault();
                        els.searchInput.focus();
                    }
                });
                document.querySelectorAll('.modal').forEach((modal) => {
                    modal.addEventListener('click', (event) => {
                        if (event.target === modal) closeModal(modal.id);
                    });
                });

                els.toggleExpandBtn.addEventListener('click', () => {
                    state.isExpanded = !state.isExpanded;
                    persistLocal();
                    updateExpandButton();
                });
                els.storageHeader.addEventListener('click', () => setStorageExpanded(!state.storageExpanded));
                els.storageHeader.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        setStorageExpanded(!state.storageExpanded);
                    }
                });

                document.getElementById('addUrlConfirmBtn').addEventListener('click', addUrl);
                document.getElementById('addUrlCancelBtn').addEventListener('click', () => closeModal('addUrlModal'));
                document.getElementById('editUrlConfirmBtn').addEventListener('click', updateUrl);
                document.getElementById('editUrlCancelBtn').addEventListener('click', () => closeModal('editUrlModal'));
                document.getElementById('editContextBtn').addEventListener('click', editSelectedUrl);
                document.getElementById('moveContextBtn').addEventListener('click', showFolderMenu);
                document.getElementById('favContextBtn').addEventListener('click', () => {
                    if (state.selectedUrlId) toggleFavorite(state.selectedUrlId);
                    hideMenus();
                });
                document.getElementById('copyContextBtn').addEventListener('click', copySelectedLink);
                document.getElementById('deleteContextBtn').addEventListener('click', deleteSelectedUrl);
                document.getElementById('openNewTabBtn').addEventListener('click', () => {
                    const current = selectedUrl();
                    if (current) openLink(current.link);
                    hideMenus();
                });
                document.getElementById('addFolderBtn').addEventListener('click', () => openModal('addFolderModal'));
                document.getElementById('editFolderBtn').addEventListener('click', () => {
                    populateFolderSelect('folderSelect', '', false);
                    document.getElementById('editFolderName').value = '';
                    openModal('editFolderModal');
                });
                document.getElementById('addFolderConfirmBtn').addEventListener('click', addFolder);
                document.getElementById('addFolderCancelBtn').addEventListener('click', () => closeModal('addFolderModal'));
                document.getElementById('editFolderConfirmBtn').addEventListener('click', editFolder);
                document.getElementById('editFolderCancelBtn').addEventListener('click', () => closeModal('editFolderModal'));
                document.getElementById('deleteFolderBtn').addEventListener('click', deleteFolder);

                bindModalSubmit('addUrlModal', addUrl);
                bindModalSubmit('editUrlModal', updateUrl);
                bindModalSubmit('addFolderModal', addFolder);
                bindModalSubmit('editFolderModal', editFolder);
            }

            function init() {
                loadLocalData();
                els.gistIdInput.value = state.currentGistId;
                if (state.githubToken) {
                    els.githubTokenInput.placeholder = '已保存令牌，重新输入可更新';
                }
                updateEngineLabel();
                updateExpandButton();
                setupEventListeners();
                renderFolders();
                renderUrls();
                updateStorageStatus();

                if (state.githubToken && state.currentGistId) {
                    loadFromGitHub({ auto: true });
                } else if (state.githubToken) {
                    showStatus('已保存令牌。输入 Gist ID 加载，或直接保存以创建新 Gist', 'info', { silentToast: true });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
